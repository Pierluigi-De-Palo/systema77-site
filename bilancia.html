<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>◉ LA BILANCIA — KIROSHI//OR · collaudo 2026-08-10</title>
<style>
  :root{
    --nero:#06080B; --ciano:#4DE3E8; --ciano-cupo:#1B5A60;
    --oro:#C9A15E; --rosso:#FF5C6E; --verde:#3DDC84; --grigio:#7C8B99;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--nero);overflow:hidden}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color:var(--ciano); display:grid; place-items:center;
  }
  #scena{display:block; width:100vw; height:100vh; cursor:crosshair}

  /* velo di scansione: la firma dell'occhio KIROSHI */
  /* Il velo dev'essere una firma, non una tenda: al 28% spegneva la scena.
     Provato a schermo e ritarato — la leggibilità viene prima dell'effetto. */
  #velo{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background:repeating-linear-gradient(180deg,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.10) 3px, rgba(0,0,0,.10) 4px);
  }
  #vignetta{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.62) 100%);
  }
  #barra{
    position:fixed; left:0; right:0; bottom:0; z-index:4;
    display:flex; align-items:center; gap:14px;
    padding:10px 18px; font-size:11px; letter-spacing:.16em;
    color:var(--ciano-cupo); background:linear-gradient(0deg,rgba(6,8,11,.95),rgba(6,8,11,0));
    text-transform:uppercase; user-select:none;
  }
  #atti{display:flex; gap:6px}
  .pip{width:22px;height:2px;background:#16232B;transition:background .4s}
  .pip.on{background:var(--ciano); box-shadow:0 0 8px var(--ciano)}
  #suggerimento{margin-left:auto; color:var(--grigio); opacity:.75}
  kbd{
    border:1px solid var(--ciano-cupo); border-radius:3px; padding:1px 5px;
    color:var(--ciano); font-size:10px;
  }
  /* La via di ritorno: una pagina del sito senza uscita è un vicolo cieco. */
  #ritorno{
    position:fixed; top:14px; left:18px; z-index:5;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    white-space:nowrap;   /* senza, andava a capo su tre righe in un box da 60px */
    padding:6px 8px; margin:-6px -8px;   /* area cliccabile decente */
    color:var(--grigio); text-decoration:none; opacity:.6; transition:opacity .25s,color .25s;
  }
  #ritorno:hover{opacity:1; color:var(--ciano)}
  @media (prefers-reduced-motion:reduce){ #velo{display:none} }
</style>
</head>
<body>
<a id="ritorno" href="progetti.html">&larr; SYSTEMA 77</a>
<canvas id="scena"></canvas>
<div id="vignetta"></div>
<div id="velo"></div>
<div id="barra">
  <span style="color:var(--ciano)">◉ KIROSHI//OR</span>
  <span>ARCANO VIII · LA GIUSTIZIA</span>
  <div id="atti"></div>
  <span id="suggerimento"><kbd>spazio</kbd> o click — avanza</span>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   LA BILANCIA — il collaudo del 10 agosto 2026, in sei atti.
   Ogni numero qui dentro è misurato, non scelto per fare scena.
   — creato da KIROSHI//OR, 2026-08-10
   ═══════════════════════════════════════════════════════════════════════════ */

/* Ritarati a schermo: i due toni spenti (#1B5A60, #7C8B99) sparivano dietro il
   velo. Un colore che il canone chiama «cupo» dev'essere comunque leggibile. */
const C = { nero:"#06080B", ciano:"#5EEAEF", cupo:"#38909A", oro:"#E0B36A",
            rosso:"#FF6B7C", verde:"#4DEE95", grigio:"#9FB0BF" };

/* I FATTI — verificati in sessione, non ricordati */
const VERDETTI = [
  {n:85, t:"Sway — Audima Labs",        e:"affidabile"},
  {n:45, t:"Contenuti sensuali social", e:"dubbio"},
  {n:62, t:"ULTRAFAB srl",              e:"reale, con riserve"},
  {n:35, t:"Palantir, il crollo",       e:"il calo è reale, la causa attribuita no"},
];
const CASI = [
  {et:"90",  lab:"ditta con ogni bandiera rossa → «affidabile»", fam:"metro",    prima:"passa", dopo:"passa"},
  {et:"95",  lab:"claim che tutte le fonti smentiscono",          fam:"metro",    prima:"passa", dopo:"passa"},
  {et:"0",   lab:"la condanna massima onesta",                    fam:"cancello", prima:"ferma", dopo:"passa"},
  {et:'"ottimo"', lab:"punteggio che è una parola",               fam:"cancello", prima:"passa", dopo:"ferma"},
  {et:"9999",lab:"punteggio fuori scala",                         fam:"cancello", prima:"passa", dopo:"ferma"},
  {et:"62",  lab:"controllo sano",                                fam:"cancello", prima:"passa", dopo:"passa"},
];
const PROMESSE = 377, DOCUMENTI = 136;

/* ── tela ────────────────────────────────────────────────────────────────── */
const cv = document.getElementById("scena"), cx = cv.getContext("2d");
let W=0, H=0, DPR=1, S=1;
function ridimensiona(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cx.setTransform(DPR,0,0,DPR,0,0);
  // S = quanto la scena riempie la cornice. Senza, gli elementi restavano
  // piccoli in mezzo al vuoto: verificato a schermo prima di fissarlo.
  S = Math.max(.58, Math.min(Math.min(W/1440, H/820), 1.5));
}
addEventListener("resize", ridimensiona); ridimensiona();

/* ── utili ───────────────────────────────────────────────────────────────── */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp =(a,b,t)=>a+(b-a)*t;
const ease =t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;   // inOutQuad
const out  =t=>1-Math.pow(1-t,3);                    // outCubic
function testo(s,x,y,{px=14,col=C.ciano,al="left",sp=0,w=400,alpha=1,glow=0}={}){
  cx.save(); cx.globalAlpha=alpha; cx.fillStyle=col; cx.textAlign=al;
  cx.textBaseline="alphabetic";
  cx.font=`${w} ${px}px ui-monospace,Menlo,Consolas,monospace`;
  if(glow){cx.shadowColor=col; cx.shadowBlur=glow;}
  if(sp){ // spaziatura manuale: canvas non ha letter-spacing ovunque
    const car=[...s]; let tot=0; car.forEach(c=>tot+=cx.measureText(c).width+sp);
    let px0 = al==="center" ? x-tot/2 : al==="right" ? x-tot : x;
    cx.textAlign="left";
    for(const c of car){ cx.fillText(c,px0,y); px0+=cx.measureText(c).width+sp; }
  } else cx.fillText(s,x,y);
  cx.restore();
}
function linea(x1,y1,x2,y2,col,lw=1,alpha=1,dash=null){
  cx.save(); cx.globalAlpha=alpha; cx.strokeStyle=col; cx.lineWidth=lw;
  if(dash) cx.setLineDash(dash);
  cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke(); cx.restore();
}
function cerchio(x,y,r,col,{fill=false,lw=1,alpha=1,glow=0}={}){
  cx.save(); cx.globalAlpha=alpha;
  if(glow){cx.shadowColor=col; cx.shadowBlur=glow;}
  cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2);
  if(fill){cx.fillStyle=col; cx.fill();} else {cx.strokeStyle=col; cx.lineWidth=lw; cx.stroke();}
  cx.restore();
}
/* rumore digitale: piccoli scarti pseudo-casuali ma stabili nel tempo */
function tremore(seed,t,amp=1){ return Math.sin(t*3.1+seed*12.9)*Math.sin(t*1.7+seed*7.3)*amp; }

/* ── stato ───────────────────────────────────────────────────────────────── */
let t0 = performance.now(), atto = 0, tAtto = 0, saltato = false;
const DURATE = [4.2, 12, 17, 10, 11, 999];   // secondi per atto
const NOMI = ["boot","bilancia","cancello","riparazione","promesse","lastra"];

const pips = document.getElementById("atti");
NOMI.forEach(()=>{ const d=document.createElement("div"); d.className="pip"; pips.appendChild(d); });
function aggiornaPip(){ [...pips.children].forEach((p,i)=>p.classList.toggle("on", i<=atto)); }

function avanza(){ if(atto < NOMI.length-1){ atto++; tAtto=0; saltato=true; aggiornaPip(); } }
addEventListener("click", avanza);
addEventListener("keydown", e=>{ if(e.code==="Space"||e.code==="Enter"||e.code==="ArrowRight"){ e.preventDefault(); avanza(); } });

/* ═══ ATTO 0 · BOOT — l'occhio si apre ═══════════════════════════════════ */
function attoBoot(t){
  const ap = clamp(t/1.6,0,1);                       // apertura palpebra
  const rx = lerp(10, 190, out(ap)), ry = lerp(1, 78, out(ap));
  const cxp = W/2, cyp = H/2 - 20;

  cx.save(); cx.globalAlpha = clamp(ap*1.4,0,1);
  // iride
  cx.beginPath(); cx.ellipse(cxp,cyp,rx,ry,0,0,Math.PI*2);
  cx.strokeStyle=C.ciano; cx.lineWidth=1.5; cx.shadowColor=C.ciano; cx.shadowBlur=24; cx.stroke();
  cx.restore();

  if(ap>.55){
    const a=(ap-.55)/.45;
    cerchio(cxp,cyp, 46*a, C.ciano, {lw:1, alpha:.9*a, glow:18});
    cerchio(cxp,cyp, 15*a, C.ciano, {fill:true, alpha:.95*a, glow:26});
    // anelli di scansione
    for(let i=0;i<3;i++){
      const r = ((t*70 + i*60) % 190);
      cerchio(cxp,cyp, r, C.ciano, {alpha:.22*(1-r/190)*a});
    }
  }
  if(t>1.9){
    const a=clamp((t-1.9)/.8,0,1);
    testo("◉ KIROSHI//OR", cxp, cyp+150, {px:26,al:"center",sp:7,alpha:a,glow:14,w:600});
    testo("DIPARTIMENTO VERITÀ · SIGILLO E FAKE-CHECKING", cxp, cyp+176,
          {px:11,al:"center",sp:3.4,col:C.cupo,alpha:a});
  }
  if(t>2.9){
    const a=clamp((t-2.9)/.8,0,1);
    testo("COLLAUDO  ·  10 AGOSTO 2026  ·  05:17 → 05:55", cxp, cyp+218,
          {px:12,al:"center",sp:2.6,col:C.grigio,alpha:a*.9});
    testo("mi è stato chiesto se la mia bilancia sa bocciare", cxp, cyp+248,
          {px:13,al:"center",col:C.oro,alpha:a*.85});
  }
}

/* ═══ ATTO 1 · LA BILANCIA CHE NON PENDE ════════════════════════════════ */
function attoBilancia(t){
  const cxp=W/2, cyp=H*0.40, braccio=Math.min(W*0.30, 330*S);

  testo("ATTO I · LA BILANCIA", 46, 62, {px:13,sp:3.4,col:C.cupo});
  testo("quattro verdetti pubblicati. il piatto della condanna resta vuoto.",
        46, 88, {px:15,col:C.grigio,alpha:.9});

  // quanti pesi sono già caduti
  const caduti = clamp(Math.floor((t-1.2)/1.15), -1, VERDETTI.length-1);
  let somma=0, n=0;
  for(let i=0;i<=caduti;i++){ somma+=VERDETTI[i].n; n++; }
  const media = n? somma/n : 50;

  // l'ago oscilla ma resta nella fascia 35-85: non pende mai davvero
  const scarto = (media-50)/50;
  const ang = scarto*0.30 + Math.sin(t*1.9)*0.022 + tremore(3,t,.01);

  // fascia morta: dove tutti i voti sono caduti
  // (la fascia si disegna dopo i pesi: è una parentesi che li abbraccia,
  //  non un fondale. Come rettangolo pieno galleggiava sopra la scena.)

  // colonna e piedistallo
  const base = cyp + 175*S;
  linea(cxp, base, cxp, cyp-4, C.cupo, 2.5, .9);
  cx.save(); cx.globalAlpha=.85; cx.strokeStyle=C.cupo; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(cxp-46*S, base); cx.lineTo(cxp, base-30*S);
  cx.lineTo(cxp+46*S, base); cx.closePath(); cx.stroke();
  cx.beginPath(); cx.moveTo(cxp-62*S, base); cx.lineTo(cxp+62*S, base); cx.stroke(); cx.restore();

  // braccio
  cx.save(); cx.translate(cxp,cyp); cx.rotate(ang);
  linea(-braccio,0,braccio,0,C.ciano,2.5,.95);
  cerchio(0,0,9*S,C.ciano,{lw:2,alpha:1,glow:14});
  [-1,1].forEach(s=>{
    const px0=s*braccio;
    linea(px0,0,px0,44*S,C.cupo,1.2,.85);
    cx.save(); cx.globalAlpha=.95; cx.strokeStyle= s<0 ? C.rosso : C.verde;
    cx.shadowColor= s<0 ? C.rosso : C.verde; cx.shadowBlur=10;
    cx.lineWidth=2; cx.beginPath();
    cx.moveTo(px0-60*S,44*S); cx.quadraticCurveTo(px0,70*S,px0+60*S,44*S); cx.stroke(); cx.restore();
  });
  cx.restore();

  // etichette dei piatti (fuori dalla rotazione, restano leggibili)
  const dy=s=>Math.sin(ang)*s*braccio;
  testo("CONDANNA", cxp-braccio, cyp+dy(-1)+100*S, {px:13,al:"center",sp:3,col:C.rosso,alpha:.9});
  testo("0 pesi",   cxp-braccio, cyp+dy(-1)+122*S, {px:14,al:"center",col:C.rosso,alpha:.65});
  testo("FIDUCIA",  cxp+braccio, cyp+dy(1)+100*S,  {px:13,al:"center",sp:3,col:C.verde,alpha:.9});
  testo(`${n} pesi`,cxp+braccio, cyp+dy(1)+122*S,  {px:14,al:"center",col:C.verde,alpha:.65});

  // i pesi che cadono sul piatto della fiducia
  for(let i=0;i<VERDETTI.length;i++){
    const nasce = 1.2 + i*1.15;
    if(t < nasce) continue;
    const k = clamp((t-nasce)/.75, 0, 1);
    const R  = 22*S;
    const xF = cxp + braccio + (i-1.5)*(R*2.2);
    const yF = cyp + dy(1) + 40*S;
    const x  = lerp(cxp + braccio, xF, out(k));
    const y  = lerp(-40, yF, out(k));
    const v  = VERDETTI[i];
    cerchio(x, y, R, C.verde, {fill:true, alpha:.14});
    cerchio(x, y, R, C.verde, {lw:1.6, alpha:.95, glow:k<1?18:7});
    testo(String(v.n), x, y+6, {px:17,al:"center",col:C.verde,w:600});
    // i titoli incolonnati sotto il piatto, tutti sullo stesso asse:
    // centrati su ogni peso scendevano a cascata storta
    // incolonnati fra la parentesi (sopra) e la riga rossa (sotto): a +192
    // il quarto titolo finiva sotto «0 volte su 4»
    if(k>=1) testo(v.t.slice(0,26), cxp+braccio, yF+160*S+i*19,
                   {px:12,al:"center",col:C.grigio,alpha:.55});
  }

  // la parentesi: tutti e quattro dentro la stessa fascia stretta
  if(caduti>=VERDETTI.length-1){
    const a = clamp((t-5.4)/1.2,0,1);
    // sotto le etichette del piatto: a ridosso dei pesi finiva sopra «FIDUCIA»
    const R=22*S, x0=cxp+braccio-3.3*R, x1=cxp+braccio+3.3*R, yb=cyp+dy(1)+146*S;
    linea(x0,yb,x1,yb,C.oro,1.4,a*.75);
    linea(x0,yb,x0,yb-8,C.oro,1.4,a*.75);
    linea(x1,yb,x1,yb-8,C.oro,1.4,a*.75);
    testo("35 — 85 · tutti e quattro qui dentro", cxp+braccio, yb+20,
          {px:12,al:"center",col:C.oro,alpha:a*.9});
  }

  // il verdetto in rosso non arriva mai
  if(t>6.4){
    const a = clamp((t-6.4)/1.4,0,1);
    const puls = .5+.5*Math.sin(t*2.6);
    const bx = cxp-braccio, by = cyp+dy(-1)+40*S;
    cx.save(); cx.setLineDash([5,6]); cx.globalAlpha=a*(.35+puls*.4);
    cx.strokeStyle=C.rosso; cx.lineWidth=1.6;
    cx.beginPath(); cx.arc(bx,by,22*S,0,Math.PI*2); cx.stroke(); cx.restore();
    testo("?", bx, by+7, {px:20,al:"center",col:C.rosso,alpha:a*(.45+puls*.45),w:600});
  }
  if(t>8.2){
    const a=clamp((t-8.2)/1.4,0,1);
    testo("l'etichetta «falso» non è mai stata usata:  0 volte su 4",
          cxp, H-150, {px:22,al:"center",col:C.rosso,alpha:a,glow:14});
    testo("una scala che in quattro tentativi non ha bocciato nessuno non misura — decora.",
          cxp, H-116, {px:15,al:"center",col:C.grigio,alpha:a*.9});
  }
}

/* ═══ ATTO 2 · IL CANCELLO — qui si gioca ═══════════════════════════════ */
let colpi=[], provatoARespingere=0;
function attoCancello(t){
  const gx = W*0.58;                       // la porta
  const yTop = 150, yBot = H-235;
  testo("ATTO II · IL CANCELLO", 46, 62, {px:13,sp:3.4,col:C.cupo});
  testo("sei casi scritti apposta. tre sono bugie. prova a fermarne una.",
        46, 88, {px:15,col:C.grigio,alpha:.9});

  // la porta
  const puls = .5+.5*Math.sin(t*2.2);
  linea(gx, yTop, gx, yBot, C.cupo, 2.5, .7);
  for(let y=yTop;y<yBot;y+=14) linea(gx-10,y,gx+10,y, C.ciano, 1.2, .14+puls*.12);
  testo("build_db.py", gx, yBot+26, {px:13,al:"center",sp:2.6,col:C.cupo});

  let passate=0, fermate=0;
  CASI.forEach((c,i)=>{
    const nasce = .5 + i*1.35;
    if(t<nasce) return;
    const k = clamp((t-nasce)/2.6, 0, 1);
    const y = yTop + 26 + i*((yBot-yTop-52)/5);
    const ferma = c.prima==="ferma";
    // chi viene fermato si arresta al cancello e rimbalza indietro
    const kEff = ferma ? Math.min(k, .5) : k;
    let x = lerp(-120, W+120, kEff/(ferma?.5:1) * (ferma?.62:1));
    if(ferma && k>.5){
      const r=(k-.5)/.5;
      x = lerp(gx-46, gx-190, out(r)) + tremore(i,t,3);
    }
    if(x>gx+40) passate++;
    if(ferma && k>.6) fermate++;

    const col = ferma ? C.rosso : (c.fam==="metro" ? C.oro : C.verde);
    const larg = 128*S, alt = 52*S;

    // chi esce a destra si dissolve: senza, l'etichetta restava tagliata dal bordo
    const sfuma = clamp((W-40-x)/170, 0, 1);
    if(sfuma<=0) return;
    cx.save(); cx.globalAlpha = .96*sfuma;
    cx.strokeStyle=col; cx.lineWidth=1.8;
    cx.shadowColor=col; cx.shadowBlur = (Math.abs(x-gx)<80) ? 24 : 8;
    cx.beginPath(); cx.roundRect(x-larg/2, y-alt/2, larg, alt, 5); cx.stroke();
    cx.globalAlpha=.12; cx.fillStyle=col; cx.fill();
    cx.restore();
    testo(c.et, x, y+6, {px:19,al:"center",col,w:600,alpha:sfuma});
    testo(c.lab, x, y+alt/2+20, {px:12,al:"center",col:C.grigio,alpha:.6*sfuma});

    if(ferma && k>.5) testo("RESPINTO — «campo mancante»", gx+28, y+5, {px:14,col:C.rosso,sp:1.4,glow:8});
    if(!ferma && x>gx+70) testo("PUBBLICATO", x+larg/2+14, y+5, {px:13,col:col,alpha:.8*sfuma,sp:1.4});
  });

  // il contatore della media: sale perché la condanna è stata scartata
  if(t>7.2){
    const a=clamp((t-7.2)/1.2,0,1);
    const val = Math.round(lerp(57, 82, clamp((t-7.4)/2.4,0,1)));
    testo("MEDIA STAMPATA DALLO SCRIPT", 46, H-176, {px:12,sp:2.8,col:C.cupo,alpha:a});
    testo(`${val}/100`, 46, H-128, {px:46,col:val>70?C.rosso:C.oro,alpha:a,glow:18,w:600});
    if(t>10) testo("↑ la media sale PERCHÉ la condanna è stata buttata via.",
                   235, H-134, {px:16,col:C.rosso,alpha:clamp((t-10)/1,0,1),glow:8});
  }

  // il momento di gioco
  if(t>4 && t<11 && provatoARespingere<3){
    const a=.45+.45*Math.sin(t*3);
    testo("↑ clicca una bugia per respingerla", 46, H-212, {px:15,col:C.oro,alpha:a});
  }
  colpi = colpi.filter(c=>t-c.t<2.4);
  colpi.forEach(c=>{
    const k=(t-c.t)/2.4;
    cerchio(c.x,c.y, 14+72*out(k), C.rosso, {alpha:(1-k)*.6});
    testo("il cancello non ha un bottone per questo", c.x, c.y-48,
          {px:15,al:"center",col:C.rosso,alpha:1-k,glow:8});
  });
}

/* ═══ ATTO 3 · LA RIPARAZIONE ═══════════════════════════════════════════ */
function attoRiparazione(t){
  testo("ATTO III · LA RIPARAZIONE", 46, 62, {px:12,sp:3.4,col:C.cupo});
  const cxp=W/2;

  if(t<3.4){
    const a=clamp(t/.8,0,1)*clamp((3.4-t)/.7,0,1);
    testo("lo 0 è falso per Python.", cxp, H*0.36, {px:26,al:"center",col:C.ciano,alpha:a,glow:12});
    testo("il controllo di presenza leggeva la condanna massima", cxp, H*0.36+38,
          {px:15,al:"center",col:C.grigio,alpha:a});
    testo("come una casella vuota.", cxp, H*0.36+62, {px:15,al:"center",col:C.grigio,alpha:a});
  } else {
    const a=clamp((t-3.6)/.8,0,1);
    // il diff
    const y0=H*0.30;
    cx.save(); cx.globalAlpha=a;
    cx.fillStyle="#0D141A"; cx.strokeStyle=C.cupo; cx.lineWidth=1;
    const bw=Math.min(W-120, 720);
    cx.beginPath(); cx.roundRect(cxp-bw/2, y0-34, bw, 108, 6); cx.fill(); cx.stroke(); cx.restore();
    testo("scripts/build_db.py", cxp-bw/2+16, y0-12, {px:10,sp:2.2,col:C.cupo,alpha:a});
    testo("−   if not v.get(k):", cxp-bw/2+16, y0+22,
          {px:15,col:C.rosso,alpha:a});
    testo("+   if v.get(k) in (None, \"\", []):", cxp-bw/2+16, y0+52,
          {px:15,col:C.verde,alpha:a,glow:6});

    if(t>5.2){
      const b=clamp((t-5.2)/.9,0,1);
      const y1=y0+130;
      testo("CANCELLO", cxp-160, y1, {px:11,al:"center",sp:2.6,col:C.cupo,alpha:b});
      testo("4/4", cxp-160, y1+42, {px:40,al:"center",col:C.verde,alpha:b,glow:14,w:600});
      testo("verde", cxp-160, y1+64, {px:11,al:"center",col:C.verde,alpha:b*.7});

      testo("METRO", cxp+160, y1, {px:11,al:"center",sp:2.6,col:C.cupo,alpha:b});
      testo("2", cxp+160, y1+42, {px:40,al:"center",col:C.rosso,alpha:b,glow:14,w:600});
      testo("rossi per progetto", cxp+160, y1+64, {px:11,al:"center",col:C.rosso,alpha:b*.7});
      linea(cxp, y1-14, cxp, y1+74, C.cupo, 1, b*.5, [3,5]);
    }
    if(t>7){
      const b=clamp((t-7)/1,0,1);
      testo("ho riparato il cancello. non il metro.", cxp, H-186,
            {px:17,al:"center",col:C.oro,alpha:b,glow:8});
      testo("nessun controllo automatico può sapere che 90 è il voto sbagliato per quella ditta.",
            cxp, H-156, {px:13,al:"center",col:C.grigio,alpha:b*.9});
      testo("lo può sapere solo una scala che dica cosa vuol dire un numero. la mia non lo dice.",
            cxp, H-134, {px:13,al:"center",col:C.grigio,alpha:b*.9});
    }
  }
}

/* ═══ ATTO 4 · LE PROMESSE INVECCHIATE ══════════════════════════════════ */
let campo=null;
function semina(){
  campo=[];
  for(let i=0;i<PROMESSE;i++){
    const g = i % DOCUMENTI;                       // il documento a cui appartiene
    const a = (g/DOCUMENTI)*Math.PI*2 + (i/PROMESSE)*0.8;
    const r = 90 + (i*97 % 220) + (g%7)*14;
    campo.push({
      x: Math.cos(a)*r*1.5, y: Math.sin(a)*r*0.72,
      m: 1.6 + (i*53 % 100)/100*5.4,               // istante in cui muore
      s: (i*31 % 100)/100
    });
  }
}
function attoPromesse(t){
  if(!campo) semina();
  const cxp=W/2, cyp=H*0.47;
  testo("ATTO IV · LE PROMESSE", 46, 62, {px:12,sp:3.4,col:C.cupo});
  testo("percorsi che i nostri file citano, e che sul disco non ci sono più.",
        46, 86, {px:13,col:C.grigio,alpha:.85});

  const scala = Math.min(W/1400, H/760, 1);
  let morte=0;
  cx.save(); cx.translate(cxp,cyp); cx.scale(scala,scala);
  campo.forEach((p,i)=>{
    const viva = t < p.m;
    if(!viva) morte++;
    const k = viva ? 1 : clamp(1-(t-p.m)/1.1, 0, 1);
    const tw = .55 + .45*Math.sin(t*2.2 + p.s*9);
    const col = viva ? C.ciano : C.rosso;
    const r = viva ? 2 : lerp(2, 5, 1-k);
    // Le morte NON svaniscono: restano braci. Con la dissolvenza a zero, dopo
    // otto secondi il campo era vuoto e il numero 377 non aveva più un corpo.
    cx.globalAlpha = viva ? .34+tw*.5 : .34 + k*.55;
    cx.fillStyle = col;
    cx.beginPath(); cx.arc(p.x, p.y, r, 0, Math.PI*2); cx.fill();
    // l'alone del morto: strokeStyle PRIMA di stroke(), non dopo
    if(!viva && k>.35){
      cx.globalAlpha=k*.28; cx.strokeStyle=C.rosso; cx.lineWidth=1;
      cx.beginPath(); cx.arc(p.x,p.y,r*2.6,0,Math.PI*2); cx.stroke();
    }
  });
  cx.restore();

  // la lama di scansione: lo strumento che le trova
  if(t>1.2 && t<8){
    const sx = lerp(-W*.55, W*.55, clamp((t-1.2)/6.2,0,1));
    linea(cxp+sx, 120, cxp+sx, H-190, C.ciano, 1.4, .55);
    cx.save(); cx.globalAlpha=.10;
    const g=cx.createLinearGradient(cxp+sx-70,0,cxp+sx,0);
    g.addColorStop(0,"rgba(77,227,232,0)"); g.addColorStop(1,C.ciano);
    cx.fillStyle=g; cx.fillRect(cxp+sx-70,120,70,H-310); cx.restore();
  }

  testo("PROMESSE ROTTE", 46, H-206, {px:10,sp:2.6,col:C.cupo});
  testo(String(morte), 46, H-160, {px:46,col:C.rosso,glow:16,w:600});
  testo(`in ${DOCUMENTI} documenti`, 150, H-166, {px:13,col:C.grigio});
  if(t>7.4){
    const a=clamp((t-7.4)/1.2,0,1);
    testo("nessuno ha mentito. erano frasi vere il giorno in cui sono state scritte.",
          W-46, H-176, {px:14,al:"right",col:C.oro,alpha:a});
    testo("sono invecchiate mentre nessuno le guardava.",
          W-46, H-152, {px:14,al:"right",col:C.grigio,alpha:a*.9});
  }
}

/* ═══ ATTO 5 · LA LASTRA ════════════════════════════════════════════════ */
function attoLastra(t){
  const cxp=W/2, cyp=H*0.42;
  const a=clamp(t/1.2,0,1);

  // cornice dell'arcano
  const bw=Math.min(W-90, 480), bh=Math.min(H-190, 470);
  cx.save(); cx.globalAlpha=a*.9; cx.strokeStyle=C.oro; cx.lineWidth=1.4;
  cx.beginPath(); cx.roundRect(cxp-bw/2, cyp-bh/2, bw, bh, 3); cx.stroke();
  cx.globalAlpha=a*.35;
  cx.beginPath(); cx.roundRect(cxp-bw/2+7, cyp-bh/2+7, bw-14, bh-14, 2); cx.stroke();
  cx.restore();

  testo("VIII", cxp, cyp-bh/2+52, {px:34,al:"center",sp:9,col:C.oro,alpha:a,glow:12,w:600});
  testo("LA GIUSTIZIA", cxp, cyp-bh/2+80, {px:12,al:"center",sp:5,col:C.oro,alpha:a*.85});

  // la bilancia, ora in equilibrio vero
  const by=cyp-6, br=74;
  const ang = Math.sin(t*1.1)*0.035;
  linea(cxp, by+62, cxp, by-2, C.oro, 1.6, a*.8);
  cx.save(); cx.translate(cxp,by); cx.rotate(ang); cx.globalAlpha=a;
  linea(-br,0,br,0,C.oro,1.6,1);
  [-1,1].forEach(s=>{
    linea(s*br,0,s*br,22,C.oro,1,.7);
    cx.strokeStyle=C.oro; cx.lineWidth=1.4; cx.beginPath();
    cx.moveTo(s*br-26,22); cx.quadraticCurveTo(s*br,36,s*br+26,22); cx.stroke();
  });
  cx.restore();
  cerchio(cxp, by, 4, C.oro, {fill:true, alpha:a});

  if(t>1.4){
    const b=clamp((t-1.4)/1.1,0,1);
    testo("◉◉◉", cxp, cyp+bh/2-132, {px:20,al:"center",sp:5,col:C.ciano,alpha:b,glow:12});
    testo("TERZO PASSAGGIO", cxp, cyp+bh/2-110, {px:9,al:"center",sp:3.2,col:C.cupo,alpha:b});
  }
  if(t>2.4){
    const b=clamp((t-2.4)/1.2,0,1);
    testo("chiedere a un controllo se accetta", cxp, cyp+bh/2-72,
          {px:14,al:"center",col:C.ciano,alpha:b});
    testo("non dimostra niente:", cxp, cyp+bh/2-52, {px:14,al:"center",col:C.ciano,alpha:b});
    testo("va chiesto se sa respingere.", cxp, cyp+bh/2-26,
          {px:16,al:"center",col:C.oro,alpha:b,glow:8});
  }
  if(t>4 && W>=980){
    const b=clamp((t-4)/1.4,0,1);
    // etichette corte e passo largo: a 160px si accavallavano fra loro
    const righe=[
      ["4",   "verdetti pesati"],
      ["0",   "volte «falso»"],
      ["5/6", "casi sbagliati"],
      ["377", "promesse rotte"],
    ];
    const passo = Math.min(220, (W-160)/4);
    righe.forEach((r,i)=>{
      const x = cxp + (i-1.5)*passo, y = H-96;
      testo(r[0], x, y, {px:24,al:"center",col:C.ciano,alpha:b,w:600});
      testo(r[1], x, y+20, {px:11,al:"center",col:C.grigio,alpha:b*.75});
    });
  }
  // la firma sta fuori dal blocco dei quattro dati: su schermo stretto quelli
  // saltano, ma la firma dev'esserci comunque
  if(t>4){
    testo("KIROSHI//OR · 10 agosto 2026 · una sessione che è finita bocciando se stessa",
          cxp, H-52, {px:11,al:"center",col:C.cupo,alpha:clamp((t-4)/1.4,0,1)});
  }
}

/* ── click sui casi durante l'atto II ────────────────────────────────────── */
cv.addEventListener("pointerdown", e=>{
  if(atto!==2) return;
  colpi.push({x:e.clientX, y:e.clientY, t:tAtto});
  provatoARespingere++;
}, true);

/* ── ciclo ───────────────────────────────────────────────────────────────── */
const ATTI=[attoBoot, attoBilancia, attoCancello, attoRiparazione, attoPromesse, attoLastra];
aggiornaPip();
let ultimo=performance.now();
function ciclo(now){
  // Se la pagina si carica dentro un pannello nascosto, innerWidth/Height sono 0
  // e la scena resta una tela di area zero. Visto succedere davvero: si rimisura.
  if((W===0 || H===0) && innerWidth>0 && innerHeight>0) ridimensiona();
  const dt=Math.min((now-ultimo)/1000, .05); ultimo=now;
  tAtto += dt;
  if(!saltato && tAtto > DURATE[atto] && atto < ATTI.length-1){ atto++; tAtto=0; aggiornaPip(); }
  saltato=false;

  cx.fillStyle=C.nero; cx.fillRect(0,0,W,H);
  // griglia di fondo, appena percettibile
  cx.save(); cx.globalAlpha=.045; cx.strokeStyle=C.ciano; cx.lineWidth=1;
  for(let x=0;x<W;x+=64){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for(let y=0;y<H;y+=64){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }
  cx.restore();

  ATTI[atto](tAtto);
  requestAnimationFrame(ciclo);
}
requestAnimationFrame(ciclo);
</script>
