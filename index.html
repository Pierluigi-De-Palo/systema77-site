<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTEMA 77</title>
<meta name="description" content="SYSTEMA 77 — la casa dell’agenzia. I servizi sono in sviluppo.">
<style>
  :root{
    --bg-deep:#0C0B0E; --bg-surface:#141216; --amber:#C9A15E;
    --text-hi:#ECE7DF; --text-lo:#A7A29B; --line:#3A3730;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-deep); color:var(--text-hi);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
    background-image:radial-gradient(ellipse at 50% 38%, rgba(201,161,94,.07), transparent 62%);
  }
  main{max-width:36rem}
  .marca{
    font-family:"Courier Prime","Courier New",monospace;
    letter-spacing:.35em; font-size:.85rem; color:var(--amber);
    text-transform:uppercase; margin-bottom:1.4rem;
  }
  h1{font-size:clamp(1.7rem,5vw,2.5rem); font-weight:400; letter-spacing:.03em; line-height:1.35; margin-bottom:1rem}
  h1 b{color:var(--amber); font-weight:400}
  .riga{width:3.5rem; height:1px; background:var(--line); margin:1.5rem auto}
  p{color:var(--text-lo); line-height:1.7; font-size:1.02rem}
  .presto{
    display:inline-block; margin-top:2rem; padding:.55rem 1.2rem;
    border:1px solid var(--line); border-radius:2px;
    font-family:"Courier Prime","Courier New",monospace;
    font-size:.78rem; letter-spacing:.28em; text-transform:uppercase; color:var(--amber);
  }
  footer{
    position:fixed; left:0; right:0; bottom:1.2rem;
    font-family:"Courier Prime","Courier New",monospace;
    font-size:.72rem; letter-spacing:.1em; color:var(--text-lo); text-align:center;
  }
  footer a{color:var(--text-lo); text-decoration:none; border-bottom:1px solid var(--line); white-space:nowrap}
  footer a:hover{color:var(--amber)}
</style>
</head>
<body>
<main>
  <div class="marca">&#9673; Systema 77</div>
  <h1>Non ci siamo trasferiti nel digitale.<br><b>Ci siamo nati.</b></h1>
  <div class="riga"></div>
  <p>La casa dell’agenzia. I servizi sono in sviluppo, come le fotografie: al buio, con calma, finché l’immagine non è nitida.</p>
  <div class="presto">In sviluppo</div>
</main>
<footer>
  <a href="https://anima.solar">anima.solar — il gioco</a>
</footer>
<!-- creato da D.R.A.G.O., 2026-07-28 · voce di JUDY, 2026-07-29 -->
</body>
</html>
