<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTEMA 77</title>
<meta name="description" content="SYSTEMA 77 — la casa dell’agenzia. I servizi sono in sviluppo.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&family=Newsreader:opsz,wght@6..72,400&display=swap');
:root{
  --giallo:#F2E205; --nero:#0A0A0A; --carta:#F7F7F2;
  --muto:#8F8A82; --linea:#2A2A26; --superficie:#141414;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--nero); color:var(--carta);
  display:flex; align-items:center; justify-content:center;
  padding:1.5rem;
}
.band{
  width:min(100%,1100px); aspect-ratio:2.35/1;
  position:relative; border:1px solid var(--linea);
  display:flex; align-items:center; justify-content:center; text-align:center;
  background:radial-gradient(ellipse at 50% 42%, rgba(242,226,5,.05), transparent 60%);
  padding:2rem;
}
@media(max-width:700px){.band{aspect-ratio:3/4}}
.edge{
  position:absolute; left:0; right:0; display:flex; justify-content:space-between;
  padding:10px 16px; font-family:'Share Tech Mono',monospace;
  font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muto);
}
.edge.top{top:0} .edge.bot{bottom:0}
main{max-width:44rem}
.marca{
  font-family:'Share Tech Mono',monospace; letter-spacing:.35em;
  font-size:.8rem; color:var(--giallo); text-transform:uppercase; margin-bottom:1.6rem;
}
h1{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  font-size:clamp(1.9rem,6vw,4.6rem); line-height:.95;
  text-transform:uppercase; letter-spacing:.01em;
}
h1 b{color:var(--giallo); font-weight:400}
p{
  font-family:'Newsreader',Georgia,serif; color:#c4c4bc;
  line-height:1.7; font-size:clamp(.95rem,1.6vw,1.05rem);
  max-width:52ch; margin:1.4rem auto 0;
}
.presto{
  display:inline-block; margin-top:2rem; padding:.6rem 1.3rem;
  border:1px solid var(--giallo); color:var(--giallo);
  font-family:'Share Tech Mono',monospace;
  font-size:.72rem; letter-spacing:.28em; text-transform:uppercase;
}
footer{
  position:fixed; left:0; right:0; bottom:1.1rem;
  font-family:'Share Tech Mono',monospace;
  font-size:.7rem; letter-spacing:.12em; color:var(--muto); text-align:center;
}
footer a{color:var(--muto); text-decoration:none; border-bottom:1px solid var(--linea); white-space:nowrap}
footer a:hover{color:var(--giallo)}
</style>
</head>
<body>
<div class="band">
  <div class="edge top"><span>Systema 77 · la casa</span><span>2077</span></div>
  <main>
    <div class="marca">&#9673; Systema 77</div>
    <h1>Non ci siamo trasferiti<br>nel digitale.<br><b>Ci siamo nati.</b></h1>
    <p>La casa dell’agenzia. I servizi sono in sviluppo, come le fotografie: al buio, con calma, finché l’immagine non è nitida.</p>
    <div class="presto">In sviluppo</div>
  </main>
  <div class="edge bot"><span>S77·00</span><span>coming soon</span></div>
</div>
<footer>
  <a href="https://anima.solar">anima.solar — il gioco</a>
</footer>
<!-- creato da D.R.A.G.O., 2026-07-28 · voce di JUDY, 2026-07-29 · veste ponte 77 di JUDY, 2026-08-01 -->
</body>
</html>
